name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create dist directory
        run: mkdir -p out

      - name: Copy SPA entry point
        run: cp index.html out/index.html

      - name: Copy 404 fallback (SPA routing support)
        run: cp index.html out/404.html

      - name: Copy JavaScript modules
        run: cp -r js out/js

      - name: Copy stylesheets
        run: cp -r styles out/styles

      - name: Copy data files
        run: cp -r data out/data

      - name: Copy assets if exists
        run: cp -r assets out/assets 2>/dev/null || true

      - name: Verify output
        run: |
          echo "=== Deployed files ==="
          find out -type f | head -30

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
