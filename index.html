  <!-- 动态加载所有脚本（版本号由 GLXT_VERSION 统一控制）-->
  <script>
    (function loadScripts() {
      var v = window.GLXT_VERSION;
      // 加载顺序：数据层 → 持久化 → 排班(状态→卡片→核心) → 其他业务 → 权限
      var scripts = [
        'data/sso-user.js',
        'data/members.js', 'data/queues.js', 'data/schedules.js', 'data/overtime.js',
        'data/lz-string.min.js',
        'data/xlsx.full.min.js',
        'data/storage.js',
        'js/app.js', 'js/schedule-state.js', 'js/schedule-cards.js', 'js/schedule.js', 'js/dashboard.js', 'js/overtime.js',
        'js/approval.js', 'js/messages.js', 'js/members.js', 'js/queue-manage.js', 'js/reports.js',
        'js/utils.js',
        'js/auth.js'
      ];
      // 所有脚本加载完成后：先初始化页面，再检测大象中继服务
      function onAllLoaded() {
        // 所有 JS 已加载完毕，安全调用 initApp
        if (typeof initApp === 'function') initApp();
      }
      function loadNext(i) {
        if (i >= scripts.length) { onAllLoaded(); return; }
        var el = document.createElement('script');
        el.src = scripts[i] + '?v=' + v;
        el.onload = function() { loadNext(i + 1); };
        document.body.appendChild(el);
      }
      loadNext(0);
    })();
  </script>
